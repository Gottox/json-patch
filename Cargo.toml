[package]
name = "json-patch"
version = "4.0.0"
authors = ["Ivan Dubrov <dubrov.ivan@gmail.com>"]
categories = []
keywords = ["json", "json-patch"]
description = "RFC 6902, JavaScript Object Notation (JSON) Patch"
repository = "https://github.com/idubrov/json-patch"
license = "MIT/Apache-2.0"
readme = "README.md"
edition = "2021"

[features]
default = ["diff"]
diff = []

[dependencies]
jsonptr = "0.7.1"
schemars = { version = "0.8", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
utoipa = { version = "5.3", optional = true }

[dev-dependencies]
expectorate = "1.2"
rand = "0.9.1"
schemars = "0.8.22"
serde_json = { version = "1.0.140", features = ["preserve_order"] }
serde_yaml = "0.9.34"
utoipa = { version = "5.3", features = ["debug"] }
